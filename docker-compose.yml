# MongoDB local pour Glowy : `docker compose up -d`
# Replica set mono-nœud « rs0 » : nécessaire aux transactions MongoDB (inscription d'un salon, modération, fidélité…).
services:
  mongo:
    image: mongo:7
    container_name: beautyhub-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialise le replica set au premier démarrage, puis vérifie qu'il est prêt
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
